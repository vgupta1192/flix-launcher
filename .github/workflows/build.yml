name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Pushes to main sign with the release key (repo secrets), so every build can
      # update the installed launcher. PRs and anything without the secrets fall
      # back to the debug key.
      - name: Restore release keystore
        if: github.event_name == 'push'
        run: echo "$FLIX_KEYSTORE_B64" | base64 -d > flix-release.keystore
        env:
          FLIX_KEYSTORE_B64: ${{ secrets.FLIX_KEYSTORE_B64 }}
      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          FLIX_STOREFILE: flix-release.keystore
          FLIX_STOREPASSWORD: ${{ secrets.FLIX_STORE_PASSWORD }}
          FLIX_KEYALIAS: ${{ secrets.FLIX_KEY_ALIAS }}
          FLIX_KEYPASSWORD: ${{ secrets.FLIX_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: flix-launcher-apk
          path: app/build/outputs/apk/release/app-release.apk
      # Publish every push to main as a release — the launcher's automatic updater
      # reads releases/latest and installs flix-launcher-<versionCode>.apk from it.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/.*versionName = "([^"]*)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          # GitHub keeps the file name for .apk assets (labels are ignored), so name it for the updater.
          APK="flix-launcher-$CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v$VERSION" "$APK" --title "v$VERSION" \
            --notes "Flix Launcher v$VERSION (versionCode $CODE)." \
            || gh release upload "v$VERSION" "$APK" --clobber
          rm -f "$APK"
